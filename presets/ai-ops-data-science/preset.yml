schema_version: "1.0"
preset:
  id: "ai-ops-data-science"
  name: "AI Ops Data Science"
  version: "0.3.0"
  description: "Guía corporativa SDD para Data Science"
  author: "AI Ops Engineering"
  license: "Proprietary"
requires:
  speckit_version: ">=0.9.0"
provides:
  templates:
    - type: "command"
      name: "ai-ops.ds.specify"
      file: "commands/ai-ops.ds.specify.md"
      description: "Crear especificación de Data Science"
    - type: "command"
      name: "ai-ops.ds.review"
      file: "commands/ai-ops.ds.review.md"
      description: "Revisar evidencia y gates de Data Science"
    - type: "artifact"
      name: "ai-ops-ds-spec-template"
      file: "templates/ai-ops-ds-spec-template.md"
      description: "Plantilla de especificación Data Science"
tags: ["ai-ops", "data-science"]
